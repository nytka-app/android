RepoType: git
Repo: https://github.com/nytka-app/android.git

Builds:
  - versionName: 0.26.3
    versionCode: 2603
    # The full hash of the v0.26.3 tag (git rev-parse 'v0.26.3^{commit}'); the reference asks for a hash, not a tag.
    commit: b0813d7c8dd0ff2428e665cc0d9a8d8ba2c1e481
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
    gradle:
      - oss

# Reproducible build: with Binaries set, F-Droid builds the unsigned oss release, compares it with the
# APK that GitHub Releases holds (signed by the project's key) and, if they match, publishes the
# project's signed APK. A version that does not match is skipped. %v is the version name.
# Enable both lines after the build matches the release APK (docs/fdroid/README.md, "Reproducible build").
# AllowedAPKSigningKeys is the lower-case SHA-256 of the signing certificate, no colons:
#   apksigner verify --print-certs nytka-0.26.3.apk   ("Signer #1 certificate SHA-256 digest")
#Binaries: https://github.com/nytka-app/android/releases/download/v%v/nytka-%v.apk
#AllowedAPKSigningKeys: <sha256 of the release certificate>

# versionCode is computed in app/build.gradle.kts (versionCodeOf(appVersion)), which fdroid's
# parser cannot read, so UpdateCheckMode: Tags cannot find the highest code by itself: add a Builds
# entry per release by hand and keep AutoUpdateMode off.
AutoUpdateMode: None
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.26.3
CurrentVersionCode: 2603
